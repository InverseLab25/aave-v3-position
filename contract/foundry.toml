[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
remappings = ["solady/=lib/solady/src/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
# Fork tests read this. Set RPC_URL (or MAINNET_RPC_URL) to an Ethereum mainnet endpoint:
#   RPC_URL=https://eth.your-provider forge test --match-path 'test/*Fork*'
mainnet = "${RPC_URL}"
